version: 2
updates:
  - package-ecosystem: "gradle"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      all-gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-gradle-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      all-docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-docker-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      all-npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      all-github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-github-actions-major:
        patterns: ["*"]
        update-types: ["major"]
